name: Bot paper trading

on:
  schedule:
    # Cada 15 minutos (minutos desplazados para evitar la congestión de GitHub a en punto)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bot-paper-trading
  cancel-in-progress: false

jobs:
  ejecutar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar el bot
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_SERVER: ${{ vars.NTFY_SERVER }}
        run: python bot.py

      - name: Guardar cartera y diario
        run: |
          git config user.name "bot-paper-trading"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cartera.json diario.md
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Ejecución $(date -u +'%Y-%m-%d %H:%M') UTC"
            git push
          fi
